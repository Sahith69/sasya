# render.yaml - Render Blueprint Deployment for Sasya AI
# Deploys FastAPI Vision & Bioclimatic Backend + React Frontend on Render Starter

services:
  # 1. FastAPI Vision & Bioclimatic Backend
  - type: web
    name: sasya-backend
    env: python
    plan: free # 100% Free forever, no credit card required
    buildCommand: pip install -r requirements.txt && python -c "from huggingface_hub import snapshot_download; snapshot_download('kritika67/sasya', local_dir='models')"
    startCommand: python -m uvicorn app_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODELS_DIR
        value: models
      - key: ENVIRONMENT
        value: production

  # 2. React Vite Frontend Static Site
  - type: static_site
    name: sasya-frontend
    buildCommand: cd frontend && npm install && npm run build
    publishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sasya-backend
          property: host
